name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test

  # Savepoint isolation and real concurrency are only observable on a server database.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cache
          POSTGRES_PASSWORD: cache
          POSTGRES_DB: cache
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cache"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CACHE_SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://cache:cache@localhost:5432/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install
      - run: make test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cache-service .
      - name: Container becomes ready
        run: |
          docker run -d --name cache-service -p 8000:8000 cache-service
          for attempt in $(seq 30); do
            curl -fs http://localhost:8000/ready && exit 0
            sleep 1
          done
          docker logs cache-service
          exit 1
