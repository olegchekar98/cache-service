services:
  cache-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Defaults to the SQLite file on the volume below; override to use PostgreSQL:
      # CACHE_SERVICE_DATABASE_URL=postgresql+asyncpg://cache:cache@postgres:5432/cache
      CACHE_SERVICE_DATABASE_URL: ${CACHE_SERVICE_DATABASE_URL:-sqlite+aiosqlite:////data/cache_service.db}
      CACHE_SERVICE_TRANSFORMER_LATENCY_SECONDS: ${CACHE_SERVICE_TRANSFORMER_LATENCY_SECONDS:-0}
    volumes:
      - cache-data:/data

  # Started only with `--profile postgres`; the service runs on SQLite by default.
  # No depends_on is needed: the service waits for its database on startup.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  cache-data:
  postgres-data:
