[project]
name = "cache-service"
version = "0.1.0"
description = "FastAPI caching microservice for generated payloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.10.0",  # cli_shortcuts, used by the CLI
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
cache-cli = "cache_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["cache_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers to drive code paths that are otherwise racy.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = []

[[tool.mypy.overrides]]
# SQLModel's table models are dynamically typed at the SQLAlchemy boundary.
module = "cache_service.models"
disallow_untyped_calls = false
